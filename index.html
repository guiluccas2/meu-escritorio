<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Escritório">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=2">
<link rel="icon" type="image/png" href="favicon-64.png?v=2">
<title>Meu Escritório</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--text:#1d2330;--muted:#6b7385;--line:#e2e5ea;
  --pri:#1f4e79;--pri2:#2d6aa3;--priSoft:#e7eff8;--ok:#1e7d4f;--okSoft:#e3f4ea;
  --warn:#a86400;--warnSoft:#fdf1dc;--bad:#b42318;--badSoft:#fde8e6;--side:#16263a;--sideText:#c9d3e0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d;--panel:#1b212b;--text:#e6e9ef;--muted:#9aa3b2;--line:#2c3441;
  --pri:#5b9bd5;--pri2:#7fb2e0;--priSoft:#1f2d3d;--ok:#4cc38a;--okSoft:#17302a;
  --warn:#e3a33b;--warnSoft:#33281a;--bad:#f07167;--badSoft:#3a1f1f;--side:#0d1117;--sideText:#aeb8c6;}}
:root[data-theme="dark"]{
  --bg:#12161d;--panel:#1b212b;--text:#e6e9ef;--muted:#9aa3b2;--line:#2c3441;
  --pri:#5b9bd5;--pri2:#7fb2e0;--priSoft:#1f2d3d;--ok:#4cc38a;--okSoft:#17302a;
  --warn:#e3a33b;--warnSoft:#33281a;--bad:#f07167;--badSoft:#3a1f1f;--side:#0d1117;--sideText:#aeb8c6;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
#temaBtn{font-size:16px;padding:6px 10px;line-height:1;margin-left:auto}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--pri);text-decoration:none}a:hover{text-decoration:underline}
#app{display:flex;min-height:100vh}
aside{width:220px;flex-shrink:0;background:var(--side);color:var(--sideText);padding:18px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:block;padding:2px 10px 20px}
.brand img{display:block;width:100%;max-width:190px;filter:invert(1)}
#printHead{display:none}
nav a{display:flex;gap:10px;align-items:center;white-space:nowrap;color:var(--sideText);padding:9px 12px;border-radius:8px;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.07);text-decoration:none}
nav a.on{background:var(--pri);color:#fff}
nav .ic{width:20px;text-align:center}
nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:600;min-width:20px;text-align:center}
nav .count.calm{background:rgba(255,255,255,.2)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;gap:10px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#menuBtn{display:none}
#busca{flex:1;max-width:520px}
#view{padding:20px;max-width:1300px;width:100%}
h1{font-size:22px;margin:0 0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1 .btn{font-size:14.5px;font-weight:400}
h1 small{font-size:14px;color:var(--muted);font-weight:400}
h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .sp,.sp{flex:1}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:auto;transform:scale(1.2);cursor:pointer}
input[type=radio]{width:auto;flex:0 0 auto;transform:scale(1.15);cursor:pointer;margin:0}
.impParte{display:flex!important;gap:8px;align-items:center;justify-content:flex-start;padding:3px 0;cursor:pointer;font-weight:400}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pri2)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:var(--pri2)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.mini{font:inherit;font-size:12.5px;border:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--pri);border-color:var(--pri)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:16px;align-items:start}
.stack>.card{margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:inherit}
.stat:hover{border-color:var(--pri2);text-decoration:none}
.stat .n{font-size:24px;font-weight:700}
.stat .l{color:var(--muted);font-size:13px}
.stat.bad .n{color:var(--bad)}.stat.warn .n{color:var(--warn)}.stat.ok .n{color:var(--ok)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{width:auto;min-width:160px}
.toolbar input[type=search]{flex:1;min-width:200px}
.toolbar input[type=checkbox]{min-width:0}
.toolbar .chk{white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr[data-href]{cursor:pointer}tr[data-href]:hover td{background:var(--priSoft)}
.tablewrap{overflow-x:auto}
.right{text-align:right}.nowrap{white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:13px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;background:var(--priSoft);color:var(--pri);white-space:nowrap;font-weight:500}
.tag.ok{background:var(--okSoft);color:var(--ok)}.tag.bad{background:var(--badSoft);color:var(--bad)}.tag.warn{background:var(--warnSoft);color:var(--warn)}.tag.grey{background:var(--bg);color:var(--muted)}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .sub{font-size:13px;color:var(--muted)}
.li.late b{color:var(--bad)}.li.today b{color:var(--warn)}
.li.done b{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.tl{position:relative}
.tl-item{border-left:3px solid var(--pri);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:10px}
.tl-item.and{border-left-color:var(--muted)}
.tl-item.lead{border-left-color:var(--warn)}
.tl-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tl-title{font-weight:600;margin-top:3px}
.tl-body{margin-top:4px;white-space:normal;word-wrap:break-word}
.tl-next{margin-top:8px;font-size:13.5px;padding:6px 10px;border-radius:8px;background:var(--warnSoft);color:var(--warn);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl-next.done{background:var(--okSoft);color:var(--ok)}
.tl-next.late{background:var(--badSoft);color:var(--bad)}
.tl-actions{margin-top:6px;display:flex;gap:6px}
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 20px}
.info > div > span:first-child{display:block;font-size:12px;color:var(--muted)}
.info .full{grid-column:1/-1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:inherit;background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.kcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:200px}
.kcol.over{outline:2px dashed var(--pri2)}
.kcol h3{font-size:13.5px;margin:0 0 10px;display:flex;justify-content:space-between}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13.5px}
.kcard:hover{border-color:var(--pri2)}
.kcard b{display:block;font-size:14.5px}
.kcard .kact{display:flex;gap:4px;margin-top:6px}
#banner:empty{display:none}
.bn{margin:12px 20px 0;padding:10px 14px;border-radius:10px;background:var(--warnSoft);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.bn.ok{background:var(--okSoft);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;flex:1;font-size:17px}
.modal-head button{font-size:24px;background:none;border:0;color:var(--muted);cursor:pointer;line-height:1}
#mForm{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fld.full{grid-column:1/-1}
.fld .row{display:flex;gap:6px}
.chk{display:flex!important;gap:8px;align-items:center;color:var(--text)!important;font-size:14.5px!important;cursor:pointer}
.mfoot{grid-column:1/-1;display:flex;gap:8px;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.sect{grid-column:1/-1;font-weight:600;font-size:13.5px;color:var(--pri);border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.calc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--bg);padding:8px 10px;border-radius:8px}
.calc input,.calc select{width:auto;padding:4px 6px}
#bulk{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--pri);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:45;width:max-content;max-width:calc(100% - 24px)}
body.hasbulk #view{padding-bottom:110px}
#bulk[hidden]{display:none}
td.sel,th.sel{width:28px;padding-right:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
.hl{background:var(--warnSoft)}
.hojeWrap{display:grid;grid-template-columns:230px minmax(300px,1fr) minmax(320px,1.15fr);gap:16px;margin-bottom:16px}
.hojeBox{background:var(--side);color:#fff;border-radius:12px;padding:18px 16px;display:flex;flex-direction:column}
.hojeBox .lbl{font-size:12px;letter-spacing:2px;opacity:.75;text-align:center}
.hojeBox .dia{font-size:44px;font-weight:700;text-align:center;line-height:1.05}
.hojeBox .mes{font-size:13.5px;text-align:center;opacity:.85;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
.hojeBox a{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:8px 2px;border-bottom:1px dashed rgba(255,255,255,.25);font-size:13.5px}
.hojeBox a:hover{text-decoration:none;background:rgba(255,255,255,.06)}
.hojeBox a b{font-size:17px;min-width:26px;text-align:right}
.hojeBox a.alerta b{color:#ff8a80}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calGrid .dw{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.calGrid .d{padding:5px 0 3px;border-radius:8px;cursor:pointer;font-size:13.5px;min-height:38px}
.calGrid .d:hover{background:var(--priSoft)}
.calGrid .d.fora{color:var(--muted);opacity:.45}
.calGrid .d.fds{color:var(--muted)}
.calGrid .d.fer{color:var(--bad)}
.calGrid .d.hoje span.n{background:var(--pri);color:#fff;border-radius:50%;display:inline-block;width:26px;height:26px;line-height:26px}
.calGrid .d.sel{outline:2px solid var(--pri2)}
.dots{display:flex;gap:2px;justify-content:center;margin-top:2px;height:6px}
.dots i,.legenda i{width:6px;height:6px;border-radius:50%;display:inline-block}
.c-prazo{background:var(--bad)}.c-aud{background:var(--warn)}.c-ret{background:var(--pri2)}.c-fin{background:var(--ok)}.c-reu{background:#8e6bbf}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legenda span{display:inline-flex;gap:4px;align-items:center}
.agItem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.agItem:last-child{border-bottom:0}
.agItem .hr{min-width:46px;font-weight:700;font-size:13px;color:var(--pri)}
.agItem .bar{width:4px;align-self:stretch;border-radius:4px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.verMais{font:inherit;font-size:12.5px;color:var(--pri);cursor:pointer;background:none;border:0;padding:0;margin-top:2px}
.personalizar{text-align:center;margin:26px 0 6px;border-top:1px solid var(--line)}
.personalizar a{position:relative;top:-11px;background:var(--bg);padding:0 12px;font-size:13.5px}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 16px}
.pgrid label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--text);cursor:pointer}
.psec{font-weight:700;margin:14px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:1100px){.hojeWrap{grid-template-columns:230px 1fr}.hojeWrap>.agenda{grid-column:1/-1}}
@media (max-width:640px){.hojeWrap{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}}
@media print{.personalizar,.verMais{display:none!important}.clamp{display:block;-webkit-line-clamp:unset}}
.lsBox{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}.lsNav a{display:block;padding:8px 10px;border-radius:8px;color:var(--text);font-size:14px}.lsNav a:hover{background:var(--bg);text-decoration:none}.lsNav a.on{background:var(--priSoft);color:var(--pri);font-weight:600}
.lsItem{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.lsItem .lsV{flex:1}.lsItem .lsV[readonly]{background:var(--bg);color:var(--muted)}
@media (max-width:760px){.lsBox{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{font:inherit;font-size:13.5px;border:0;background:var(--panel);padding:7px 14px;cursor:pointer;color:var(--muted)}.seg button.on{background:var(--pri);color:#fff}
.bigCal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bigCal .h{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);padding:6px;text-align:center;border-bottom:1px solid var(--line);text-transform:capitalize}
.bigCal .c{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;font-size:12px;cursor:pointer}
.bigCal .c:hover{background:var(--priSoft)}.bigCal .c:nth-child(7n){border-right:0}.bigCal .c.fora{background:var(--bg);opacity:.55}.bigCal .c .dn{text-align:right;color:var(--muted);font-size:12px}.bigCal .c.fer .dn{color:var(--bad)}.bigCal .c.hoje .dn b{background:var(--pri);color:#fff;border-radius:50%;padding:1px 6px}
.chip{display:block;border-radius:5px;padding:2px 5px;margin-top:3px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;cursor:pointer}
.kb{display:grid;gap:10px;overflow-x:auto;padding:12px;border-radius:14px;background:linear-gradient(160deg,#16263a,#2b3f55)}
.kbc{background:#1f2933;border-radius:12px;padding:10px;color:#e6e9ef;align-self:start;min-height:80px}.kbc.over{outline:2px dashed #7fb2e0}
.kbc h3{font-size:13.5px;margin:2px 4px 10px;display:flex;justify-content:space-between;gap:6px}
.kcd{background:#2d3a46;border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:13.5px;line-height:1.35;cursor:grab}.kcd:hover{background:#34445a}.kcd.feito{opacity:.55}.kcd.feito .ktit{text-decoration:line-through}
.kcd .lb{height:6px;width:42px;border-radius:4px;margin-top:4px}.kcd .ktit{cursor:pointer;margin:4px 0}
.kcd .meta{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;flex-wrap:wrap}
.kcd .kbtn{color:#cfd6de;border-color:#56677a;padding:1px 7px}.kcd .kbtn:hover{color:#fff;border-color:#9fb3c8}
.due{border-radius:5px;padding:1px 6px;font-size:12px}.due.late{background:#c0392b;color:#fff}.due.ok{background:#2e9d5a;color:#fff}.due.n{color:#b9c2cc}
.kbadd{color:#b9c2cc;font-size:13.5px;padding:6px 4px;cursor:pointer}.kbadd:hover{color:#fff}
.mstrip{display:flex;gap:6px;overflow-x:auto}.mstrip .m{min-width:90px;border:1px solid var(--line);border-radius:10px;padding:6px;text-align:center;font-size:12px;background:var(--panel);cursor:pointer}.mstrip .m:hover{border-color:var(--pri2)}.mstrip .m b{display:block;font-size:13px}.mstrip .m.atual{border-color:var(--pri2)}.mstrip .m.on{background:var(--pri);color:#fff;border-color:var(--pri)}.mstrip .m .up{color:var(--ok)}.mstrip .m .dn{color:var(--bad)}.mstrip .m .pd{opacity:.7}.mstrip .m.on .up,.mstrip .m.on .dn{color:#fff}
.fin3{grid-template-columns:repeat(3,minmax(0,1fr))!important;margin-top:4px}
.cmp{display:flex;gap:18px;align-items:flex-end;height:150px;padding:0 10px}.cmp .g{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;text-align:center}.cmp .bars{display:flex;gap:6px;align-items:flex-end;height:120px}.cmp .bars div{width:26px;border-radius:4px 4px 0 0}
.var{font-size:12px;border-radius:10px;padding:1px 7px;white-space:nowrap}.var.up{background:var(--okSoft);color:var(--ok)}.var.dn{background:var(--badSoft);color:var(--bad)}
@media (max-width:1100px){.fin3{grid-template-columns:1fr!important}}
.iaBox{background:var(--warnSoft);border:1px solid rgba(168,100,0,.25);border-radius:12px;padding:12px 14px}.iaBox.iaOff{padding:10px 14px}
.iaFiles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.iaChip{display:inline-flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12.5px}.iaChip img{height:28px;border-radius:4px}.iaChip button{border:0;background:none;cursor:pointer;color:var(--muted)}
.iaFill input,.iaFill select,.iaFill textarea,input.iaFill,select.iaFill,textarea.iaFill{background:var(--warnSoft)!important;border-color:var(--warn)!important}
#syncChip{font-size:13px;padding:7px 10px;white-space:nowrap}
#syncChip.sBad{border-color:var(--bad);color:var(--bad)}
#syncChip.sOk{color:var(--ok)}
#sideBack{display:none}
@media (max-width:900px){
  #sideBack.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39}
  aside{position:fixed;left:-240px;z-index:40;transition:left .2s}
  aside.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  #menuBtn{display:inline-block}

}

  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:4px max(4px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:11px;color:var(--muted);border-radius:8px;position:relative;text-decoration:none}
  #tabbar a span{font-size:19px;line-height:1.1}
  #tabbar a.on{color:var(--pri);font-weight:600;background:var(--priSoft)}
  #tabbar .count{position:absolute;top:1px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;font-weight:600;line-height:16px;min-width:16px;text-align:center}
  #tabbar .count.calm{background:var(--muted)}
  #toast{bottom:calc(78px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
  #bulk{bottom:calc(74px + env(safe-area-inset-bottom));max-width:calc(100vw - 16px)}
  h1 .sp{flex-basis:100%;height:0}

  .seg{max-width:100%;overflow-x:auto}.seg button{padding:7px 11px;flex-shrink:0}

  img,video,canvas{max-width:100%}

/* ===== barra lateral: Dropbox e aparência ===== */
aside{display:flex;flex-direction:column}
#sideFoot{margin-top:auto;padding:14px 4px 4px;display:grid;gap:10px}
#syncSide{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--sideText);font:inherit;font-size:13px;padding:4px 8px;cursor:pointer;text-align:left;border-radius:6px}
#syncSide:hover{background:rgba(255,255,255,.07)}
#syncSide .dot{width:9px;height:9px;border-radius:50%;background:#7d8796;flex:none;transition:background .3s}
#syncSide.s-ok .dot{background:#3fb950}#syncSide.s-salvando .dot{background:#e3a33b}#syncSide.s-erro .dot{background:#f07167}#syncSide.s-erro{color:#ffb4ab}
.temaSeg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.06);border-radius:10px;padding:3px;gap:2px}
.temaSeg button{font:inherit;font-size:13px;border:0;background:none;color:var(--sideText);padding:6px 4px;border-radius:8px;cursor:pointer}
.temaSeg button.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
/* ===== ⚡ rápido ===== */
.rapido{background:var(--panel);border:1.5px solid var(--pri2);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.rapTop{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rapLinha{display:flex;gap:8px}.rapLinha input{flex:1;min-width:0}
.rapPrev{margin-top:8px;background:var(--priSoft);border-radius:10px;padding:8px 10px;font-size:13.5px}
.rapPrev .r{display:flex;gap:6px;padding:2px 0}
/* ===== botão + e menu de criação ===== */
#plusSheet{position:fixed;inset:0;z-index:45;background:rgba(10,15,25,.45)}
#plusSheet[hidden]{display:none}
.psBox{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:20px 20px 0 0;padding:10px 14px calc(78px + env(safe-area-inset-bottom))}
.psGr{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 10px}
.psTit{font-weight:650;margin:0 0 4px 6px}
.psBox button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 6px;font:inherit;font-size:15px;color:var(--text);text-align:left;cursor:pointer}
.psBox button:last-child{border-bottom:0}.psBox i{font-style:normal;font-size:20px;width:28px;text-align:center}.psBox small{display:block;color:var(--muted);font-size:12px}
.tbPlus{display:none}
.cv{display:contents}

  #tabbar{z-index:46}

  table.stack tr{display:block;position:relative;padding:10px 2px;border-top:1px solid var(--line)}
  table.stack tbody tr:first-child{border-top:0}
  table.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border:0;padding:2px 0;text-align:right;white-space:normal}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;text-align:left;font-weight:500;flex:none}
  table.stack td[data-label=""]::before{content:none}
  table.stack td[data-label=""]{justify-content:flex-end}
  table.stack td:first-child:not(.sel){justify-content:flex-start;text-align:left;font-size:15px;font-weight:650;padding-bottom:4px}
  table.stack td:first-child:not(.sel)::before{content:none}
  table.stack td.sel{position:absolute;top:10px;left:0;padding:0}
  table.stack td.sel + td{padding-left:28px}
  table.stack td.hideM, table.stack td:empty{display:none}
  table.stack td .small, table.stack td .sub{text-align:right}
  table.stack td .cv{display:block;min-width:0;text-align:right}
  table.stack td:first-child:not(.sel) .cv{text-align:left}
  .card.tablewrap{padding:4px 12px}
}

const poloCliente = p => POLO_ATIVO.includes(p?.posicao) ? 'ativo' : POLO_PASSIVO.includes(p?.posicao) ? 'passivo' : '';

function norm(d){
  d = d && typeof d === 'object' ? d : {}; COL.forEach(c => { if(!Array.isArray(d[c])) d[c] = []; }); d.meta = d.meta || {};
  // migração da versão 1 (honorários -> financeiro)
  if(!Array.isArray(d.meta.modelosHon)) d.meta.modelosHon = JSON.parse(JSON.stringify(MODELOS_PADRAO));
  if(Array.isArray(d.honorarios)){ d.honorarios.forEach(h => { const {tipo, ...r} = h; d.financeiro.push({...r, natureza:'entrada', categoria:HON_MAP[tipo] || 'Outras receitas'}); }); delete d.honorarios; }
  // partes do processo (versão 4 -> lista de partes por polo)
  d.processos.forEach(p => { if(!Array.isArray(p.partes)) p.partes = [];
    if(p.parteContrariaId){ if(!p.partes.some(x => x.pessoaId === p.parteContrariaId)) p.partes.push({pessoaId:p.parteContrariaId, polo:poloOposto(p)}); delete p.parteContrariaId; } });
  // testemunhas: saem da lista de partes e vão para a aba própria do processo
  d.processos.forEach(p => { if(!Array.isArray(p.testemunhas)) p.testemunhas = [];
    const ts = (p.partes || []).filter(x => x.polo === 'testemunha');
    if(ts.length){ ts.forEach(x => { if(!p.testemunhas.some(t => t.pessoaId === x.pessoaId)) p.testemunhas.push({id:'t' + Math.random().toString(36).slice(2, 10), pessoaId:x.pessoaId, arroladaPor:'Nosso cliente', intimacao:'', situacao:'Arrolada', obs:''}); });

/* ================= PREENCHIMENTO COM IA (Claude, da Anthropic) ================= */
const IA_MODELO = 'claude-opus-5-5';
const IA_SDK = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.136.0/+esm';
const IA_PRECO = {in:4, out:20};   // US$ por milhão de tokens (Claude Opus 5.5)
const iaKey = () => { try{ return localStorage.getItem('escritorio_ia_key') || ''; }catch(e){ return ''; } };
function iaUso(){ try{ const u = JSON.parse(localStorage.getItem('escritorio_ia_uso')) || {}; return u.mes === today().slice(0, 7) ? u : {mes:today().slice(0, 7), in:0, out:0, n:0}; }catch(e){ return {mes:today().slice(0, 7), in:0, out:0, n:0}; } }
function iaSomarUso(u){ const a = iaUso(); a.in += u.input_tokens || 0; a.out += u.output_tokens || 0; a.n++; try{ localStorage.setItem('escritorio_ia_uso', JSON.stringify(a)); }catch(e){} }
const iaCustoUsd = u => (u.in * IA_PRECO.in + u.out * IA_PRECO.out) / 1e6;
let iaModP = null;
async function iaClient(){
  if(!iaKey()) throw new Error('a chave da IA não está configurada (Backup e dados → Inteligência artificial)');
  if(!iaModP) iaModP = import(IA_SDK);
  let mod; try{ mod = await iaModP; }catch(e){ iaModP = null; throw new Error('não foi possível carregar o módulo da IA (verifique a internet)'); }
  const Anthropic = mod.default || mod.Anthropic;
  return {Anthropic, client:new Anthropic({apiKey:iaKey(), dangerouslyAllowBrowser:true, maxRetries:2})};
}
async function iaChamar(system, partes, schema){
  const {Anthropic, client} = await iaClient();
  let resp;
  try{
    resp = await client.beta.messages.create({
      model:IA_MODELO, max_tokens:16000,
      betas:['server-side-fallback-2026-07-01'], fallbacks:'default',
      output_config:{effort:'medium', format:{type:'json_schema', schema}},
      system, messages:[{role:'user', content:partes}],
    });
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError) throw new Error('a chave da IA foi recusada pela Anthropic — confira em Backup e dados');
    if(e instanceof Anthropic.PermissionDeniedError) throw new Error('a conta da Anthropic não tem permissão para este uso (verifique créditos e permissões)');
    if(e instanceof Anthropic.RateLimitError) throw new Error('muitas solicitações seguidas — aguarde um minuto e tente de novo');
    if(e instanceof Anthropic.BadRequestError) throw new Error('a IA não aceitou o pedido: ' + e.message);
    if(e instanceof Anthropic.APIConnectionError) throw new Error('sem conexão com a IA (verifique a internet)');
    if(e instanceof Anthropic.APIError) throw new Error(`a IA respondeu com erro ${e.status}: ${e.message}`);
    throw e;
  }
  if(resp.usage) iaSomarUso(resp.usage);
  if(resp.stop_reason === 'refusal') throw new Error('a IA não processou este conteúdo (recusa de segurança)');
  if(resp.stop_reason === 'max_tokens') throw new Error('o conteúdo é grande demais — envie menos páginas ou imagens');
  const txt = resp.content.filter(b => b.type === 'text').map(b => b.text).join('');
  try{ return JSON.parse(txt); }catch(e){ throw new Error('a resposta da IA veio em formato inesperado — tente de novo'); }
}
// ----- arquivos (imagens reduzidas no próprio aparelho; PDF enviado como documento) -----
function lerBase64(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
async function prepararArquivo(file){
  if(file.type === 'application/pdf'){ if(file.size > 25 * 1024 * 1024) throw new Error('PDF maior que 25 MB'); return {tipo:'pdf', nome:file.name, data:await lerBase64(file)}; }
  if(!file.type.startsWith('image/')) throw new Error('tipo de arquivo não suportado: ' + (file.name || file.type));
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('não foi possível ler a imagem')); i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const durl = c.toDataURL('image/jpeg', 0.9);
    return {tipo:'img', nome:file.name || 'imagem colada', data:durl.split(',')[1], thumb:durl};
  } finally { URL.revokeObjectURL(url); }
}

      const r = await iaChamar(IA_SISTEMA[tipo](), partes, IA_SCHEMA[tipo]());

function iaSet(f, nome, v){
  const el = f.elements[nome]; if(!el || v === undefined || v === null || v === '') return false;
  if(el.type === 'checkbox'){ el.checked = !!v; }
  else if(el.tagName === 'SELECT'){ if(![...el.options].some(o => o.value === String(v))) el.insertAdjacentHTML('beforeend', `<option value="${esc(v)}">${esc(v)}</option>`); el.value = v; }
  else el.value = v;
  el.dispatchEvent(new Event('change', {bubbles:true})); el.dispatchEvent(new Event('input', {bubbles:true}));
  (el.closest('.fld') || el).classList.add('iaFill'); return true;
}
const iaData = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? v : '';

function iaAcharProcesso(...textos){
  const re = /\d{7}-?\d{2}\.?\d{4}\.?\d\.?\d{2}\.?\d{4}/g, nums = [];
  textos.forEach(t => { (String(t || '').match(re) || []).forEach(n => nums.push(digits(n))); const d = digits(t); if(d.length === 20) nums.push(d); });
  for(const n of nums){ const p = db.processos.find(x => digits(x.numero) === n); if(p) return p; }
  return null;
}

  const n = norm_s(nome).trim(); if(n.length < 3) return null;
  return db.pessoas.find(p => norm_s(p.nome) === n) || db.pessoas.find(p => norm_s(p.nome).includes(n) || n.includes(norm_s(p.nome))) || null;
}
function iaCalcPrazo(it){

function idade(n){ if(!n) return null; const d = parseD(n), h = new Date(); let a = h.getFullYear() - d.getFullYear(); const m = h.getMonth() - d.getMonth(); if(m < 0 || (m === 0 && h.getDate() < d.getDate())) a--; return a; }
const dataMaioridade = n => n ? `${+n.slice(0, 4) + 18}${n.slice(4, 10)}` : '';

const representados = id => db.pessoas.filter(x => x.menor && (x.representantes || []).some(r => r.pessoaId === id));
function repTxt(p){
  if(!p?.menor) return ''; const rs = repsDe(p); if(!rs.length) return 'menor/incapaz — representante não informado';
  const a = idade(p.nascimento), verbo = a != null && a >= 16 && a < 18 ? 'assistido(a)' : 'representado(a)';
  return `${verbo} por ` + rs.map(r => `${pessoaNome(r.pessoaId)}${r.relacao ? ` (${r.relacao.toLowerCase()})` : ''}`).join(' e ');
}

function splitCents(total, n){ const e = Math.floor(total / n); return Array.from({length:n}, (_, i) => i === n - 1 ? total - e * (n - 1) : e); }
function planoAcordo(a){
  const n = Math.max(1, Math.min(240, parseInt(a.parcelas, 10) || 1)), pct = (Number(a.pctContratual) || 0) / 100;
  const P = splitCents(Math.round((Number(a.principal) || 0) * 100), n), S = splitCents(Math.round((Number(a.sucumbencia) || 0) * 100), n);
  return P.map((p, i) => { const hon = Math.round(p * pct); return {p:p / 100, s:S[i] / 100, hon:hon / 100, cli:(p - hon) / 100}; });
}

    const add = (natureza, categoria, valor, txt, vencimento) => { if(valor > 0) db.financeiro.push({id:uid(), criadoEm:now, pessoaId:a.pessoaId, processoId:a.processoId || '', acordoId:a.id, parcela:i + 1,
      natureza, categoria, valor, descricao:a.descricao + ' — ' + txt + tag, vencimento, pagoEm:'', valorPago:'', forma:''}); };
    if(conta){
      add('entrada', CAT_CLI, x.cli, 'valor do cliente', venc);
      add('entrada', CAT_HC, x.hon, 'honorários contratuais', venc);
      add('entrada', CAT_HS, x.s, 'honorários sucumbenciais', venc);
      add('saida', CAT_REP, x.cli, 'repasse ao cliente', addDays(venc, dias));
    } else {
      add('entrada', CAT_HC, x.hon, 'honorários contratuais (pagos pelo cliente)', addDays(venc, dias));
      add('entrada', CAT_HS, x.s, 'honorários sucumbenciais', venc);
    }
  });
  save();
}

let agMes = null, agSem = null, agCalVis = 'mes';
const PALETA_AREA = ['#2d6aa3','#2e9d5a','#8e6bbf','#d9a400','#d35400','#c0392b','#16a085','#7f8c8d','#b03a7c','#2c3e50'];
const corArea = a => { const i = OPT.area.indexOf(a); return a ? PALETA_AREA[(i >= 0 ? i : a.length) % PALETA_AREA.length] : '#5b7c99'; };
const corTipo = p => p.concluido ? '#9aa5b1' : ['Audiência','Perícia'].includes(p.tipo) ? '#d48806' : p.tipo === 'Prazo processual' ? '#c0392b' : p.tipo === 'Reunião' ? '#8e6bbf' : '#5b7c99';
function filtroAgenda(usarPeriodo, ignorarSit){
  const f = F.ag, t = today();
  let ini = '', fim = '';
  if(usarPeriodo){
    if(f.per === 'hoje'){ ini = fim = t; }
    else if(f.per === 'semana'){ ini = addDays(t, -parseD(t).getDay()); fim = addDays(ini, 6); }
    else if(f.per === 'mes'){ ini = t.slice(0, 8) + '01'; fim = addDays(addMonths(ini, 1), -1); }
    else if(f.per === 'prox30'){ ini = t; fim = addDays(t, 30); }
    else if(f.per === 'pers'){ ini = f.de; fim = f.ate; }
  }
  return db.prazos.filter(p => {
    if(!ignorarSit && f.sit === 'pend' && p.concluido) return false;
    if(!ignorarSit && f.sit !== 'pend' && f.sit !== 'todas' && (p.situacao || (p.concluido ? 'Realizado' : 'Pendente')) !== f.sit) return false;
    if(f.tipo && p.tipo !== f.tipo) return false;
    if(f.atras && !atrasado(p)) return false;
    if(f.area && byId('processos', p.processoId)?.area !== f.area) return false;
    if((ini || fim) && (!p.data || (ini && p.data < ini) || (fim && p.data > fim))) return false;
    const pr = byId('processos', p.processoId);
    return has(f.q, p.titulo, p.obs, p.local, p.subtipo, pessoaNome(p.pessoaId), pessoaNome(pr?.clienteId), procLabel(pr));
  });
}

function agendaCal(){

VIEWS.processo = id => {

  aplicarMenu();

  lastRoute = route;

function updateCounts(){
  const t = today(), w = addDays(t, 7);
  const badge = (id, total, urgentes, tip) => { const el = document.getElementById(id); if(!el) return;
    el.hidden = !total; el.textContent = total; el.classList.toggle('calm', !urgentes); el.title = tip;
    const tb = document.getElementById({cPrz:'tbPrz', cPub:'tbMais'}[id]); if(tb){ tb.hidden = el.hidden; tb.textContent = el.textContent; tb.className = el.className; } };
  // Atendimentos: retornos combinados com clientes ainda não feitos
  const ret = db.conversas.filter(c => c.proximaData && !c.retornoFeito), retU = ret.filter(c => c.proximaData <= t).length;
  badge('cRet', ret.length, retU, `${ret.length} retorno(s) pendente(s)` + (retU ? ` — ${retU} vencido(s) ou para hoje` : ' — nenhum atrasado'));
  // Prazos e agenda: todos os pendentes
  const prz = db.prazos.filter(x => !x.concluido), przA = prz.filter(atrasado).length, przH = prz.filter(x => x.data === t).length;
  badge('cPrz', prz.length, przA + przH, `${prz.length} prazo(s)/compromisso(s) pendente(s)` + (przA ? ` — ${przA} atrasado(s)` : '') + (przH ? ` — ${przH} hoje` : '') + (!przA && !przH ? ' — nenhum atrasado' : ''));
  // Publicações e movimentações novas
  const mPub = db.monitor.filter(m => m.status === 'nova' && m.tipo === 'publicacao').length, mMov = db.monitor.filter(m => m.status === 'nova' && m.tipo !== 'publicacao').length;
  badge('cPub', mPub + mMov, mPub, `${mPub} publicação(ões) nova(s) · ${mMov} movimentação(ões) a confirmar`);
  // Leads em andamento
  const leads = db.leads.filter(l => !['Fechado','Perdido'].includes(l.status)), leadU = leads.filter(l => l.proximoContato && l.proximoContato <= t).length;
  badge('cLead', leads.length, leadU, `${leads.length} lead(s) em andamento` + (leadU ? ` — ${leadU} com contato atrasado ou para hoje` : ''));
  // Financeiro: vencidos, repasses pendentes e o que vence nos próximos 7 dias
  let venc = 0, rep = 0, prox = 0;
  db.financeiro.forEach(l => { if(l.pagoEm) return; const st = finStatus(l); if(st === 'aguardando') return;
    if(l.categoria === CAT_REP && l.acordoId){ rep++; return; }
    if(st === 'vencido') venc++; else if(l.vencimento <= w) prox++; });
  badge('cFin', venc + rep + prox, venc + rep, [venc && `${venc} lançamento(s) vencido(s)`, rep && `${rep} repasse(s) a clientes pendente(s)`, prox && `${prox} a vencer nos próximos 7 dias`].filter(Boolean).join(' — ') || '');
}

function setLeadStatus(l, st){
  upsert('leads', {id:l.id, status:st}); render();
  if(st === 'Fechado' && !l.pessoaId) setTimeout(() => convertLead(l.id), 50);
  if(st === 'Perdido'){ const m = prompt('Motivo da perda (opcional):', l.motivoPerda || ''); if(m !== null){ upsert('leads', {id:l.id, motivoPerda:m}); render(); } }
}

const selIds = () => [...new Set([...document.querySelectorAll('#view [data-sel]:checked')].flatMap(c => c.dataset.sel.split(',')))].filter(id => byId('financeiro', id));
function updateBulk(){
  const box = document.getElementById('bulk'), ids = selIds();
  const pids = [...document.querySelectorAll('#view [data-psel]:checked')].map(x => x.dataset.psel);
  document.querySelectorAll('#view .card').forEach(c => { const h = c.querySelector('[data-pselall]'); if(!h) return; const all = c.querySelectorAll('[data-psel]'), on = c.querySelectorAll('[data-psel]:checked'); h.checked = all.length > 0 && on.length === all.length; h.indeterminate = on.length > 0 && on.length < all.length; });
  if(pids.length){ document.body.classList.add('hasbulk'); box.hidden = false;
    box.innerHTML = `<b>${pids.length} compromisso(s) selecionado(s)</b><button class="btn ok" data-act="bpConcluir">✔ Concluir</button><button class="btn" data-act="bpSit">Mudar situação</button><button class="btn" data-act="bpData">📅 Mudar data</button><button class="btn" data-act="bpCol">▦ Mover para coluna</button><button class="btn danger" data-act="bpDel">🗑 Excluir</button><button class="btn" data-act="bulkClear">Limpar</button>`; return; }
  document.querySelectorAll('#view table').forEach(t => { const all = t.querySelectorAll('[data-sel]'), on = t.querySelectorAll('[data-sel]:checked'), h = t.querySelector('[data-selall]');
    if(h){ h.checked = all.length > 0 && on.length === all.length; h.indeterminate = on.length > 0 && on.length < all.length; } });
  document.body.classList.toggle('hasbulk', ids.length > 0);
  if(!ids.length){ box.hidden = true; box.innerHTML = ''; return; }
  const marc = document.querySelectorAll('#view [data-sel]:checked').length;
  const ls = ids.map(id => byId('financeiro', id)), saldo = sum(ls.map(l => l.natureza === 'saida' ? -l.valor : l.valor)), pend = ls.filter(l => !l.pagoEm).length;
  box.hidden = false;
  box.innerHTML = `<b>${marc !== ids.length ? `${marc} parcela(s) marcada(s) = ${ids.length} lançamentos` : `${ids.length} lançamento(s) selecionado(s)`}</b><span class="muted small">saldo ${money(saldo)}</span>
    ${pend ? `<button class="btn ok" data-act="bulkReal">✔ Dar baixa (${pend})</button>` : ''}${/^#\/acordo\//.test(location.hash) ? '<button class="btn primary" data-act="bulkDiv">⚖ Alterar divisão</button>' : ''}<button class="btn danger" data-act="bulkDel">🗑 Excluir</button><button class="btn" data-act="bulkClear">Limpar seleção</button>`;
}

        else { const op = await escolherPrimeiraSync(remote);
          if(op === 'cancelar') throw Object.assign(new Error('sincronização cancelada — escolha o que fazer para continuar'), {code:'cancel'});
          if(op === 'drive') novo = remote; else if(op === 'local') novo = db; else { const m = merge3({}, db, remote); novo = m.data; conflitos = m.conflitos; } }
      }
      const sNovo = JSON.stringify(novo), mudouLocal = sNovo !== JSON.stringify(db);
      let rev = meta.rev;
      if(sNovo !== JSON.stringify(remote)) rev = (await remoteUpload(JSON.parse(sNovo), meta.rev)).rev;
      setDriveCfg({rev}); await idbSet('base', JSON.parse(sNovo));
      if(mudouLocal){ db = norm(JSON.parse(sNovo)); localStorage.setItem(KEY, sNovo); updateCounts(); renderSeguro(); toast('🔄 Dados atualizados com o Dropbox'); }
      if(drive.edits === n0) setDirty(false);
      if(conflitos) setTimeout(() => alert(`Atenção: em ${conflitos} registro(s), o mesmo campo foi alterado neste e em outro aparelho ao mesmo tempo. Nesses campos foi mantida a versão deste aparelho (os demais campos foram juntados) — confira se está tudo certo.`), 200);
    }
    drive.ultimo = new Date(); drive.erro = ''; drive.again = 0; setStatus('ok');
  }catch(e){
    if(e.code === 'conflito' && drive.again < 3){ repetir = true; drive.again++; }
    else { drive.erro = e.message; drive.again = 0;
      setStatus(e.code === 'auth' ? (isDirty() ? 'pendente-auth' : 'auth') : e.code === 'offline' ? 'offline' : 'erro'); }
  }finally{
    drive.busy = false;
    if(repetir || (drive.again && drive.status !== 'erro')){ const n = drive.again; setTimeout(() => driveSync('repetir'), 300); if(!repetir) drive.again = 0; }
  }
}

const MON_OAB_PADRAO = [{numero:'355980', uf:'SP'}];

const limparHtml = h => String(h || '').replace(/<br\s*\/?>/gi, '\n').replace(/<\/(p|div|tr)>/gi, '\n').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();

const pubDataPublicacao = disp => { let d = addDays(disp, 1); while(!isBusiness(d, false)) d = addDays(d, 1); return d; };

const monProc = it => byId('processos', it.processoId) || procPorNumero(it.numero);

function pubDoDjen(x, id, o){
  const num = x.numeroprocessocommascara || x.numero_processo || x.numeroProcesso || '';
  let disp = String(x.data_disponibilizacao || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(disp)){ const m = String(x.datadisponibilizacao || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); disp = m ? `${m[3]}-${m[2]}-${m[1]}` : today(); }
  const pr = procPorNumero(num);
  return {id, tipo:'publicacao', fonte:'DJEN', status:'nova', numero:mascaraCnj(num), data:disp, tribunal:x.siglaTribunal || '', orgao:x.nomeOrgao || '',

    processoId:pr?.id || '', oab:`${o.numero}/${o.uf}`, cancelada: x.ativo === false || !!x.data_cancelamento, criadoEm:disp};
}
async function djenBuscar(motivo){
  const cfg = monCfg(); if(!cfg.ativo || monBusy.djen) return {novos:0, erro:''};
  monBusy.djen = true; setMonLocal({djenTent:Date.now()});
  const t = today(), L = monLocal();
  const ini = L.djenAte && L.djenAte > addDays(t, -30) ? L.djenAte : addDays(t, -10);
  const existentes = new Set(db.monitor.map(m => m.id)), novos = []; let erro = '';
  try{
    for(const o of cfg.oabs){
      for(let pag = 1; pag <= 20; pag++){
        const q = new URLSearchParams({numeroOab:digits(o.numero), ufOab:String(o.uf || '').toUpperCase(), dataDisponibilizacaoInicio:ini, dataDisponibilizacaoFim:t, pagina:pag, itensPorPagina:100});
        const r = await fetch('https://comunicaapi.pje.jus.br/api/v1/comunicacao?' + q, {headers:{Accept:'application/json'}});
        if(!r.ok) throw new Error('o DJEN respondeu com erro ' + r.status);
        const j = await r.json(), it = j.items || [];
        it.forEach(x => { const id = 'djen:' + (x.id || x.hash); if(existentes.has(id)) return; existentes.add(id); novos.push(pubDoDjen(x, id, o)); });
        if(it.length < 100) break;
      }
    }
  }catch(e){ erro = /fetch|network|load/i.test(e.message) ? 'sem conexão com o DJEN' : e.message; }
  if(novos.length){ db.monitor.push(...novos); save(); }
  setMonLocal(erro ? {djenErro:erro} : {djenAte:t, djenUlt:Date.now(), djenErro:''});
  monBusy.djen = false;
  if(novos.length){ toast(`📰 ${novos.length} publicação(ões) nova(s) no DJEN`); roboEnviarPubs(novos); }
  if(novos.length || motivo === 'manual' || naTelaPub()) renderSeguro(); else updateCounts();
  return {novos:novos.length, erro};
}
async function roboChamar(params, corpo){
  const c = monCfg(); if(!c.roboUrl || !c.roboToken) throw new Error('robô não configurado');
  const r = corpo ? await fetch(c.roboUrl, {method:'POST', body:JSON.stringify({token:c.roboToken, ...corpo}), keepalive:!!corpo.agenda})
                  : await fetch(c.roboUrl + (c.roboUrl.includes('?') ? '&' : '?') + new URLSearchParams({token:c.roboToken, ...params}));
  let j; try{ j = await r.json(); }catch(e){ throw new Error('o robô não respondeu corretamente (confira o endereço e a implantação)'); }
  if(!j.ok) throw new Error(j.erro || 'erro no robô');
  return j;
}

async function roboSincronizar(motivo){

  monBusy.robo = true; setMonLocal({roboTent:Date.now()});
  const L = monLocal(); let erro = '', novos = 0;
  try{
    const nums = [...new Set(db.processos.filter(p => !INATIVOS.includes(p.status)).map(p => digits(p.numero)).filter(d => d.length === 20))].sort(), h = nums.join(',');
    if(h !== L.roboLista || Date.now() - (L.roboListaEm || 0) > 3 * 864e5){ await roboChamar(null, {processos:nums}); setMonLocal({roboLista:h, roboListaEm:Date.now()}); }
    const r = await roboChamar({acao:'itens', desde:L.roboDesde || ''});
    const ex = new Set(db.monitor.map(m => m.id)); let maxC = L.roboDesde || '';
    (r.itens || []).forEach(i => { if(String(i.capturadoEm) > maxC) maxC = String(i.capturadoEm); if(!i.id || ex.has(i.id)) return; ex.add(i.id);
      const pr = procPorNumero(i.numero), dt = String(i.data || '').slice(0, 10);
      db.monitor.push({id:i.id, tipo:i.tipo === 'publicacao' ? 'publicacao' : 'movimento', fonte:i.fonte || 'DataJud', status:'nova', numero:mascaraCnj(i.numero), data:dt, tribunal:i.tribunal || '', orgao:i.orgao || '',
        titulo:i.titulo || '', texto:String(i.texto || '').slice(0, 30000), link:i.link || '', processoId:pr?.id || '', criadoEm:dt}); novos++; });
    if(novos) save();
    setMonLocal({roboDesde:maxC, roboUlt:Date.now(), roboErro:'', roboExec:r.ultimaExecucao || ''});
  }catch(e){ erro = /fetch|network|load/i.test(e.message) ? 'sem conexão com o robô' : e.message; setMonLocal({roboErro:erro}); }
  monBusy.robo = false;

/* ================= IMPORTAR PROCESSOS DA OAB (pelas intimações do DJEN) ================= */
const nomeProprio = s => String(s || '').toLowerCase().replace(/(^|[\s\-'(])([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(D[aoe]s?|E|Em|Com)\b/g, w => w.toLowerCase()).replace(/^./, c => c.toUpperCase())
  .replace(/\b(Ltda|S\.?a\.?|Me|Epp|Eireli|Inss|Cpf|Cnpj)\b/gi, w => w.toUpperCase());
const poloDjen = p => /^a/i.test(String(p || '')) ? 'ativo' : /^p/i.test(String(p || '')) ? 'passivo' : '';
let impBusca = null; // {rodando, msg, achados}
async function djenVarrer(desde){
  const cfg = monCfg(), t = today(), mapa = {}, existentes = new Set(db.processos.map(p => digits(p.numero)).filter(Boolean));
  const jaFila = new Set(db.importar.map(i => digits(i.numero)));
  impBusca = {rodando:true, msg:'Iniciando…', achados:0, consultas:0};
  const prog = () => { const el = document.getElementById('impProg'); if(el) el.textContent = impBusca.msg; };
  const janela = async (o, ini, fim, dias) => {
    for(let pag = 1; pag <= 50; pag++){
      const q = new URLSearchParams({numeroOab:digits(o.numero), ufOab:String(o.uf || '').toUpperCase(), dataDisponibilizacaoInicio:ini, dataDisponibilizacaoFim:fim, pagina:pag, itensPorPagina:100});
      let r; for(let k = 0; k < 4; k++){ r = await fetch('https://comunicaapi.pje.jus.br/api/v1/comunicacao?' + q, {headers:{Accept:'application/json'}}); if(r.status !== 429 && r.status < 500) break; await new Promise(z => setTimeout(z, 3000 * (k + 1))); }
      impBusca.consultas++;
      if(!r.ok){ if(dias > 7 && (r.status === 400 || r.status === 422)) return 'menor'; throw new Error('o DJEN respondeu com erro ' + r.status); }
      const j = await r.json(), it = j.items || [];
      it.forEach(x => {
        const d = digits(x.numero_processo || x.numeroprocessocommascara); if(d.length !== 20 || existentes.has(d) || jaFila.has(d)) return;
        const disp = String(x.data_disponibilizacao || '').slice(0, 10);
        const g = mapa[d] = mapa[d] || {numero:mascaraCnj(d), tribunal:x.siglaTribunal || '', orgao:'', classe:'', partes:{}, advogados:{}, n:0, primeira:disp, ultima:disp};
        g.n++; if(disp && disp < g.primeira) g.primeira = disp;
        if(disp >= g.ultima){ g.ultima = disp; if(x.nomeOrgao) g.orgao = x.nomeOrgao; if(x.nomeClasse) g.classe = x.nomeClasse; }
        if(!g.orgao) g.orgao = x.nomeOrgao || ''; if(!g.classe) g.classe = x.nomeClasse || '';
        (x.destinatarios || []).forEach(p => { const nm = String(p.nome || '').trim(); if(nm && !g.partes[norm_s(nm)]) g.partes[norm_s(nm)] = {nome:nm, polo:poloDjen(p.polo)}; });
        (x.destinatarioadvogados || []).forEach(a => { const ad = a.advogado || a; const nm = String(ad.nome || '').trim(); if(nm) g.advogados[norm_s(nm)] = nm + (ad.numero_oab ? ` (OAB ${ad.numero_oab}/${ad.uf_oab || ''})` : ''); });
      });
      impBusca.achados = Object.keys(mapa).length;
      impBusca.msg = `Consultando ${fmtD(ini)} a ${fmtD(fim)}… ${impBusca.achados} processo(s) novo(s) encontrado(s) até agora`; prog();
      if(it.length < 100) break;
      await new Promise(z => setTimeout(z, 250));
    }
  };
  try{
    for(const o of cfg.oabs){
      let ini = desde;
      while(ini <= t){
        let dias = 30, fim = addDays(ini, dias - 1); if(fim > t) fim = t;
        if(await janela(o, ini, fim, dias) === 'menor'){ for(let a = ini; a <= fim; a = addDays(a, 7)){ const b = addDays(a, 6) > fim ? fim : addDays(a, 6); await janela(o, a, b, 7); } }
        ini = addDays(fim, 1);
      }
    }
    const novos = Object.entries(mapa).map(([d, g]) => ({id:'imp:' + d, numero:g.numero, tribunal:g.tribunal, orgao:g.orgao, classe:g.classe, partes:Object.values(g.partes), advogados:Object.values(g.advogados),
      comunicacoes:g.n, primeira:g.primeira, ultima:g.ultima, status:'pendente', criadoEm:t}));
    if(novos.length){ db.importar.push(...novos); save(); }
    impBusca = {rodando:false, msg:`✅ Busca concluída: ${novos.length} processo(s) novo(s) para revisar (${impBusca.consultas} consulta(s) ao DJEN).`};
  }catch(e){
    impBusca = {rodando:false, msg:'⚠️ ' + (/fetch|network|load/i.test(e.message) ? 'sem conexão com o DJEN' : e.message) + ' — tente de novo; o que já foi encontrado não se perde se você repetir a busca.'};
  }
  if(location.hash.startsWith('#/importar')) renderSeguro();
}
function impInfo(it){ const d = digits(it.numero), j = d[13], tr = d.slice(14, 16);
  const temOpt = (lista, v) => lista.includes(v) ? v : '';
  return {trab: j === '5', area: j === '5' ? temOpt(OPT.area, 'Trabalhista') : '',
    sistema: j === '5' ? temOpt(OPT.sistema, 'PJe — Justiça do Trabalho') : j === '4' ? temOpt(OPT.sistema, 'PJe') : (j === '8' && tr === '26') ? temOpt(OPT.sistema, 'e-SAJ') : ''}; }

    <div class="sub">${esc([nomeProprio(it.classe), it.orgao].filter(Boolean).join(' · '))}</div>
    <div class="sub">${it.comunicacoes} intimação(ões) no DJEN · de ${fmtD(it.primeira)} a ${fmtD(it.ultima)}</div>
    ${it.partes.length ? `<div style="margin-top:8px"><div class="small muted" style="margin-bottom:4px">Partes intimadas — marque quem é o seu <b>cliente</b>:</div>
      ${it.partes.map((p, i) => `<label class="impParte"><input type="radio" name="cli-${esc(it.id)}" value="${i}" ${i === sug ? 'checked' : ''} ${it.status !== 'pendente' ? 'disabled' : ''}> ${esc(nomeProprio(p.nome))} ${p.polo ? `<span class="tag grey">${pol[p.polo]}</span>` : ''}${i === sug ? ' <span class="tag ok">já é cliente</span>' : ''}</label>`).join('')}</div>`
      : '<div class="small muted" style="margin-top:6px">O DJEN não informou as partes.</div>'}
    ${it.advogados.length ? `<div class="small muted" style="margin-top:6px">Advogados intimados: ${esc(it.advogados.slice(0, 6).join('; '))}</div>` : ''}</div>`;

const DIAS_SEM = {domingo:0, dom:0, segunda:1, seg:1, 'segunda-feira':1, terca:2, ter:2, 'terca-feira':2, quarta:3, qua:3, 'quarta-feira':3, quinta:4, qui:4, 'quinta-feira':4, sexta:5, sex:5, 'sexta-feira':5, sabado:6, sab:6};

function parseRapido(txt){
  txt = String(txt || '').trim(); if(!txt) return null;
  const t = today(), tk = txt.split(/\s+/), usado = tk.map(() => false), nn = s => norm_s(s).replace(/[.,;:!?]+$/, '');
  let data = '', hora = '', proc = null, pessoa = null, dias = 0, contagem = 'u', base = '', tipo = '', subtipo = '';
  for(let i = 0; i < tk.length; i++){ // "a partir de 12/11"
    if(nn(tk[i]) === 'a' && nn(tk[i + 1] || '') === 'partir' && nn(tk[i + 2] || '') === 'de' && /^\d{1,2}\/\d{1,2}/.test(tk[i + 3] || '')){
      const [d, m, y] = tk[i + 3].replace(/[.,]$/, '').split('/'); let yy = y ? +y : +t.slice(0, 4); if(yy < 100) yy += 2000;
      base = `${yy}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; usado[i] = usado[i + 1] = usado[i + 2] = usado[i + 3] = true; }
  }
  tk.forEach((w, i) => { if(usado[i]) return; const x = nn(w); let m;
    if(!proc && (m = x.match(/^(\d+)\.(\d+)$/))){ const p = db.processos.find(p => procCode(p) === `${+m[1]}.${+m[2]}`); if(p){ proc = p; usado[i] = true; return; } }
    if(!proc && digits(w).length === 20){ const p = procPorNumero(w); if(p){ proc = p; usado[i] = true; return; } }
    if(!dias && (m = x.match(/^(\d{1,3})(du|d|dias?|dia)$/))){ dias = +m[1]; usado[i] = true; return; }
    if(!dias && /^\d{1,3}$/.test(x) && /^(dias?|du|d\.?u\.?)$/.test(nn(tk[i + 1] || ''))){ dias = +x; usado[i] = usado[i + 1] = true;
      if(/^uteis$/.test(nn(tk[i + 2] || ''))) usado[i + 2] = true; if(/^corridos?$/.test(nn(tk[i + 2] || ''))){ contagem = 'c'; usado[i + 2] = true; } return; }
    if(/^corridos?$/.test(x) && dias){ contagem = 'c'; usado[i] = true; return; }
    if(!hora && (m = x.match(/^(?:as)?(\d{1,2})(?:h|:)(\d{2})?h?$/))){ const h = +m[1]; if(h < 24){ hora = `${String(h).padStart(2, '0')}:${m[2] || '00'}`; usado[i] = true; if(i && /^(as|a)$/.test(nn(tk[i - 1]))) usado[i - 1] = true; return; } }
    if(!data){
      if(x === 'hoje'){ data = t; usado[i] = true; return; }
      if(x === 'amanha'){ data = addDays(t, 1); usado[i] = true; return; }
      if(x === 'depois' && nn(tk[i + 1] || '') === 'de' && nn(tk[i + 2] || '') === 'amanha'){ data = addDays(t, 2); usado[i] = usado[i + 1] = usado[i + 2] = true; return; }
      if(x in DIAS_SEM){ const alvo = DIAS_SEM[x]; let d = addDays(t, 1); while(parseD(d).getDay() !== alvo) d = addDays(d, 1); data = d; usado[i] = true; if(i && /^(na|no|nesta|neste|proxima|proximo)$/.test(nn(tk[i - 1]))) usado[i - 1] = true; return; }
      if((m = x.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/))){ let yy = m[3] ? +m[3] : +t.slice(0, 4); if(yy < 100) yy += 2000;
        let d = `${yy}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; if(!m[3] && d < addDays(t, -30)) d = `${yy + 1}${d.slice(4)}`; data = d; usado[i] = true; if(i && /^(dia|em)$/.test(nn(tk[i - 1]))) usado[i - 1] = true; return; }
    }
    if(!tipo){ const tp = TIPO_PALAVRA.find(([re]) => re.test(x)); if(tp && OPT.tipoPrazo.includes(tp[1])){ tipo = tp[1]; return; } }
  });
  if(['Audiência', 'Perícia'].includes(tipo)) tk.forEach((w, i) => { if(subtipo || usado[i]) return; const x = nn(w);
    const st = OPT.subtipo.find(s => nn(s) === x || (x.length >= 4 && nn(s).startsWith(x))); if(st && st.split(' ').length === 1){ subtipo = st; usado[i] = true; } });
  if(!proc){ // cliente pelo nome (palavra de 3+ letras que identifica um único cliente)
    tk.forEach((w, i) => { if(pessoa || usado[i]) return; const x = nn(w); if(x.length < 3) return;
      const hits = db.pessoas.filter(p => p.tipo === 'Cliente' && norm_s(p.nome).split(/\s+/).includes(x)); if(hits.length === 1) pessoa = hits[0]; }); }
  if(!tipo) tipo = dias ? 'Prazo processual' : 'Tarefa';
  if(dias){ const b = base || t; data = calcPrazo(b, dias, contagem); base = b; }
  let titulo = tk.filter((w, i) => !usado[i]).join(' ').replace(/^(para|de|em|no|na)\s+/i, '').trim();
  if(tipo === 'Audiência' && /^audi[eê]ncia$/i.test(titulo) && subtipo) titulo = 'Audiência de ' + subtipo.toLowerCase();
  if(!titulo) titulo = subtipo ? `${tipo} de ${subtipo.toLowerCase()}` : tipo;
  titulo = titulo.charAt(0).toUpperCase() + titulo.slice(1);
  const feriados = []; if(dias && contagem === 'u'){ for(let d = addDays(base, 1); d <= data; d = addDays(d, 1)){ const wd = parseD(d).getDay(); if(wd && wd !== 6 && !isBusiness(d, true)) feriados.push(d); } }
  return {titulo, tipo, subtipo, data, hora, processoId:proc?.id || '', pessoaId:proc?.clienteId || pessoa?.id || '', dias, contagem, base, feriados};
}
function rapidoRegistro(r){
  const rec = {titulo:r.titulo, tipo:r.tipo, subtipo:r.subtipo, data:r.data, hora:r.hora, processoId:r.processoId, pessoaId:r.pessoaId, situacao:'Pendente', concluido:false};
  if(r.tipo === 'Prazo processual' && r.data){ rec.dataFatal = r.data; if(r.dias) rec.obs = `Prazo de ${r.dias} dia(s) ${r.contagem === 'u' ? 'úteis' : 'corridos'} contado a partir de ${fmtD(r.base)} (lançamento rápido).`; }
  rec.coluna = colunaAuto(rec); return rec;
}
function rapidoPrevia(r){
  if(!r) return '';
  const pr = byId('processos', r.processoId), pe = byId('pessoas', r.pessoaId);
  const ico = {'Prazo processual':'⏰', 'Audiência':'⚖️', 'Perícia':'🔬', 'Reunião':'👥', 'Diligência':'🚗'}[r.tipo] || '📌';
  const sem = r.data ? parseD(r.data).toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '') : '';
  return `<div class="r">${ico} <span><b>${esc(r.tipo)}</b>${r.subtipo && !norm_s(r.titulo).includes(norm_s(r.subtipo)) ? ' · ' + esc(r.subtipo) : ''}${norm_s(r.titulo) !== norm_s(r.tipo) ? ' · ' + esc(r.titulo) : ''}</span></div>
    ${pr ? `<div class="r">📁 <span>${esc(procLabel(pr))}${pe ? ' · ' + esc(pe.nome) : ''}</span></div>` : pe ? `<div class="r">👤 <span>${esc(pe.nome)}</span></div>` : ''}
    <div class="r">📅 <span>${r.data ? `${r.dias ? 'vence ' : ''}<b>${sem}, ${fmtD(r.data)}</b>${r.hora ? ' às <b>' + r.hora + '</b>' : ''}${r.dias ? ` — ${r.dias} dia(s) ${r.contagem === 'u' ? 'úteis' : 'corridos'} a partir de ${fmtD(r.base)}` : ''}${r.feriados.length ? ` <span class="muted">(feriado${r.feriados.length > 1 ? 's' : ''} ${r.feriados.map(d => fmtD(d).slice(0, 5)).join(', ')} considerado${r.feriados.length > 1 ? 's' : ''})</span>` : ''}` : '<span class="muted">sem data — vai para “Em análise”</span>'}</span></div>
    ${r.tipo === 'Prazo processual' && r.data ? `<div class="r">⚠️ <span>prazo fatal ${fmtD(r.data)}</span></div>` : ''}
    <div class="r small muted">Enter para salvar · <a href="#" data-act="rapidoForm">✏️ abrir formulário completo</a></div>`;
}
function rapidoHtml(){
  return `<form class="rapido" id="rapidoForm" autocomplete="off"><div class="rapTop"><b>⚡ Rápido</b><span class="small muted">— digite e veja a prévia: <i>contestação 15 dias 152.1</i> · <i>audiência 03/12 14h30 152.1 conciliação</i> · <i>ligar Eduardo amanhã</i></span></div>
    <div class="rapLinha"><input id="rapidoIn" placeholder="Ex.: réplica 15 dias 152.1" enterkeyhint="done"><button class="btn primary" type="button" data-act="rapidoSalvar">Salvar</button></div><div id="rapidoPrev" class="rapPrev" hidden></div></form>`;
}
document.addEventListener('input', e => { if(e.target.id !== 'rapidoIn') return; const r = parseRapido(e.target.value), box = document.getElementById('rapidoPrev'); if(!box) return; box.hidden = !r; box.innerHTML = rapidoPrevia(r); });
document.addEventListener('submit', e => { if(e.target.id !== 'rapidoForm') return; e.preventDefault();
  const r = parseRapido(document.getElementById('rapidoIn').value); if(!r) return toast('Digite o compromisso. Ex.: contestação 15 dias 152.1');
  const n = upsert('prazos', rapidoRegistro(r)); toast(`✅ ${n.tipo} criado${n.data ? ' para ' + fmtD(n.data) : ''}`); render(); setTimeout(() => document.getElementById('rapidoIn')?.focus(), 50); });
A.rapidoSalvar = () => document.getElementById('rapidoForm').requestSubmit();
A.rapidoForm = () => { const r = parseRapido(document.getElementById('rapidoIn')?.value); formPrazo(r ? rapidoRegistro(r) : {}); };
A.rapidoAbrir = () => { const ir = () => { const i = document.getElementById('rapidoIn'); if(i){ i.focus(); i.scrollIntoView({block:'center'}); } };
  if(document.getElementById('rapidoIn')) ir(); else { go('#/painel'); setTimeout(ir, 120); } };

/* ================= BOTÃO "+" (celular) ================= */
A.plusMenu = () => { const s = document.getElementById('plusSheet'); s.hidden = !s.hidden; document.getElementById('plusBtn').classList.toggle('aberto', !s.hidden); };
document.getElementById('plusSheet').addEventListener('click', e => { if(e.target.closest('[data-act]') || e.target.id === 'plusSheet'){ document.getElementById('plusSheet').hidden = true; document.getElementById('plusBtn').classList.remove('aberto'); } });

/* ================= TABELAS VIRAM CARTÕES NO CELULAR ================= */
function rotularTabelas(raiz){
  (raiz || document).querySelectorAll('#view table:not(.nostack)').forEach(t => {
    t.classList.add('stack');
    const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr, tfoot tr').forEach(tr => { let i = 0;
      for(const td of tr.children){ if(td.dataset.label === undefined){ const h = heads[i] || ''; td.dataset.label = h;
        if(!td.classList.contains('sel') && td.childNodes.length > 1){ const w = document.createElement('div'); w.className = 'cv'; while(td.firstChild) w.appendChild(td.firstChild); td.appendChild(w); }
        if(!h && !td.classList.contains('sel') && !td.querySelector('button,a,input,select') && td.textContent.trim().length <= 2) td.classList.add('hideM'); }
        i += td.colSpan || 1; } });
  });
}
new MutationObserver(() => { cancelAnimationFrame(rotularTabelas._r); rotularTabelas._r = requestAnimationFrame(() => rotularTabelas()); }).observe(document.getElementById('view'), {childList:true, subtree:true});

/* ================= ATALHOS DO ÍCONE DO APP ================= */
(function(){ const a = new URLSearchParams(location.search).get('a'); if(!a) return;
  history.replaceState(null, '', location.pathname + location.hash);
  setTimeout(() => { if(a === 'conversa') A.newConv({}); else if(a === 'prazo') A.newPrazo({}); else if(a === 'publicacoes') go('#/publicacoes'); else if(a === 'rapido') A.rapidoAbrir(); }, 400); })();

/* ================= APARÊNCIA (claro / escuro) ================= */
function temaAtual(){ const t = document.documentElement.dataset.theme; return t === 'light' || t === 'dark' ? t : 'auto'; }
function mostrarTema(){ const t = temaAtual();
  document.querySelectorAll('.temaSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === t));
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = '#16263a'; }
A.temaSet = d => { const v = d.v;
  try{ if(v === 'auto') localStorage.removeItem('escritorio_tema'); else localStorage.setItem('escritorio_tema', v); }catch(e){}
  if(v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  mostrarTema(); };
mostrarTema();

/* ================= INÍCIO ================= */
(async function init(){
  try{ navigator.storage?.persist?.(); }catch(e){}
  render();
  const voltouDoDropbox = await dbxRetorno();
  setStatus(driveAtivo() ? (isDirty() ? 'sync' : 'ok') : 'off');
  if(!voltouDoDropbox && driveAtivo()){ if(temSessao()) driveSync('abertura'); else setStatus(isDirty() ? 'pendente-auth' : 'auth'); }
  monLimpar(); setTimeout(monitorAuto, driveAtivo() ? 5000 : 1500);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') roboEnviarAgenda(); else setTimeout(monitorAuto, 4000); }); setInterval(monitorAuto, 5 * 60000);
  if('showSaveFilePicker' in window){
    const h = await idbGet('fh');
    if(h){ fileHandle = h; try{ filePerm = (await h.queryPermission({mode:'readwrite'})) === 'granted'; }catch(e){ filePerm = false; } render(); }
  }
})();
