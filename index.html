<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16263a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=2">

<title>Meu Escritório</title>
<link rel="stylesheet" href="css/estilo.css?v=2026.11.13-13">
</head>
<body>
<div id="app">
  <aside id="side">
    <a class="brand" href="#/painel" title="Início"><img class="logo" alt="Guilherme Garcia Advogado"></a>
    <nav id="nav">
      <a href="#/painel" data-v="painel"><span class="ic">🏠</span>Início</a>
      <a href="#/conversas" data-v="conversas"><span class="ic">💬</span>Atendimentos<span class="count" id="cRet" hidden></span></a>
      <a href="#/agenda" data-v="agenda"><span class="ic">📅</span>Prazos e agenda<span class="count" id="cPrz" hidden></span></a>
      <a href="#/publicacoes" data-v="publicacoes"><span class="ic">📰</span>Publicações<span class="count" id="cPub" hidden></span></a>
      <a href="#/processos" data-v="processos"><span class="ic">📁</span>Processos</a>
      <a href="#/pessoas" data-v="pessoas"><span class="ic">👤</span>Clientes e partes</a>
      <a href="#/leads" data-v="leads"><span class="ic">🎯</span>Leads<span class="count" id="cLead" hidden></span></a>
      <a href="#/financeiro" data-v="financeiro"><span class="ic">💰</span>Financeiro<span class="count" id="cFin" hidden></span></a>
      <a href="#/config" data-v="config"><span class="ic">💾</span>Backup e dados</a>
    </nav>
    <div id="sideFoot">
      <button id="syncSide" data-act="syncSide" title="Sincronização com o Dropbox"><i class="dot"></i><span>Dropbox</span></button>
      <div class="temaSeg" role="group" aria-label="Aparência"><button data-act="temaSet" data-v="light">Claro</button><button data-act="temaSet" data-v="dark">Escuro</button><button data-act="temaSet" data-v="auto">Auto</button></div>
      <div id="versaoTxt" class="versao"></div>
    </div>
  </aside>
  <div id="sideBack"></div>
  <main>
    <header class="top">
      <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
      <input id="busca" type="search" placeholder="Buscar cliente, processo, CPF, conversa…">
      <button class="btn" id="syncChip" data-act="syncChip" hidden></button>
      <button class="btn primary" id="quickConv" data-act="newConv" title="Atalho: Alt+N">💬 <span class="lbl">Registrar conversa</span></button>
    </header>
    <div id="banner"></div>
    <div id="printHead"><img class="logo" alt="Guilherme Garcia Advogado"><div id="printInfo"></div></div>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box">
  <div class="modal-head"><h3 id="mTitle"></h3><button id="mClose" aria-label="Fechar">×</button></div>
  <form id="mForm" autocomplete="off"></form>
</div></div>
<nav id="tabbar" aria-label="Navegação">
  <a href="#/painel" data-v="painel"><span>🏠</span>Início</a>
  <a href="#/agenda" data-v="agenda"><span>📅</span>Agenda<b class="count" id="tbPrz" hidden></b></a>
  <div class="tbPlus"><button id="plusBtn" data-act="plusMenu" aria-label="Criar">+</button></div>
  <a href="#/processos" data-v="processos"><span>📁</span>Processos</a>
  <a href="#" data-v="menu" id="tbMenu"><span>☰</span>Mais<b class="count" id="tbMais" hidden></b></a>
</nav>
<div id="plusSheet" hidden><div class="psBox"><div class="psGr"></div><div class="psTit">Criar</div>
  <button data-act="rapidoAbrir"><i>⚡</i><span>Lançamento rápido<small>“contestação 15 dias 152.1”</small></span></button>
  <button data-act="newConv"><i>💬</i><span>Registrar conversa</span></button>
  <button data-act="newAnd"><i>📄</i><span>Novo andamento</span></button>
  <button data-act="newPrazo"><i>📅</i><span>Novo prazo / compromisso</span></button>
  <button data-act="newFin"><i>💰</i><span>Novo lançamento financeiro</span></button>
  <button data-act="newPessoa"><i>👤</i><span>Novo cliente</span></button>
</div></div>
<div id="bulk" hidden></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const VERSAO = '2026.11.13-13';
(function(){ try{ const t = localStorage.getItem('escritorio_tema'); if(t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }catch(e){} })();
</script>

</body>
